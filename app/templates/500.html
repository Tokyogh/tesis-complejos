{% extends "base.html" %}
{% block titulo %}Error del servidor{% endblock %}

{% block contenido %}
<section class="relative overflow-hidden bg-acero-950 text-white">
    <div class="absolute inset-0 patron-plano-oscuro opacity-50"></div>
    <div class="absolute top-0 left-1/2 w-96 h-96 -translate-x-1/2 rounded-full bg-red-600/20 blur-3xl"></div>

    <div class="relative max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-24 text-center">
        <p class="cifra text-7xl font-extrabold text-red-500">{{ codigo }}</p>
        <h1 class="mt-6 text-3xl sm:text-5xl font-extrabold tracking-tight">Algo salió mal en el servidor</h1>
        <p class="mt-5 text-slate-300 leading-relaxed">
            No pudimos procesar tu solicitud. Intenta nuevamente en unos minutos o escríbenos para recibir asistencia.
        </p>
        <div class="mt-10 flex flex-col sm:flex-row gap-4 justify-center">
            <a href="{{ url_for('main.index') }}" class="rounded-xl bg-arcilla-500 px-7 py-4 font-bold text-white shadow-glow transition hover:bg-arcilla-600 hover:-translate-y-0.5">Ir al inicio</a>
            <a href="{{ url_for('contact.contacto') }}" class="rounded-xl border-2 border-white/20 px-7 py-4 font-bold text-white transition hover:bg-white/10">Reportar problema</a>
        </div>
    </div>
</section>
{% endblock %}
